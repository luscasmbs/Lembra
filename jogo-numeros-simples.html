<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembra+ | Numeros simples</title>
  <link rel="icon" href="./assets/img/favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <style>
    .number-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 18px 0;
    }
    .number-grid input {
      aspect-ratio: 1;
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 12px;
      text-align: center;
      font-size: 28px;
      font-weight: 900;
    }
    .number-grid input[readonly] {
      background: var(--violet-soft);
      color: var(--violet-dark);
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="back-btn" onclick="goTo('jogos.html')" type="button">&lt;</button>
      <div>
        <div class="topbar-title">Numeros simples</div>
        <div class="topbar-subtitle">Complete com 1, 2, 3 e 4</div>
      </div>
      <span class="brand-small">lembra+</span>
    </header>

    <section class="content-tight">
      <div class="card" style="margin:0">
        <div class="row-title">Regra</div>
        <p class="muted">Cada linha e coluna deve ter os numeros 1, 2, 3 e 4 uma vez.</p>
      </div>

      <div class="number-grid" id="numberGrid"></div>
      <div class="actions">
        <button class="btn" id="checkNumbers" type="button">Verificar</button>
        <button class="btn secondary" id="newNumbers" type="button">Novo jogo</button>
      </div>
    </section>

    <section class="finish-card" data-finish></section>
  </main>

  <script src="./assets/script/lembra-v2.js"></script>
  <script>
    const solution = [1,2,3,4,3,4,1,2,2,1,4,3,4,3,2,1];
    const puzzle = [1,"",3,"","",4,"",2,2,"","",3,"",3,"",1];
    const grid = document.getElementById("numberGrid");

    function renderPuzzle() {
      grid.innerHTML = "";
      puzzle.forEach((value, index) => {
        const input = document.createElement("input");
        input.inputMode = "numeric";
        input.maxLength = 1;
        input.value = value;
        if (value) input.readOnly = true;
        input.addEventListener("input", () => input.value = input.value.replace(/[^1-4]/g, ""));
        input.dataset.index = index;
        grid.appendChild(input);
      });
    }

    document.getElementById("checkNumbers").addEventListener("click", () => {
      const ok = [...grid.querySelectorAll("input")].every(input => Number(input.value) === solution[Number(input.dataset.index)]);
      if (ok) showCompletion("Numeros simples", 140);
      else alert("Ainda nao esta completo. Tente mais uma vez, sem pressa.");
    });

    document.getElementById("newNumbers").addEventListener("click", renderPuzzle);
    renderPuzzle();
  </script>
</body>
</html>
