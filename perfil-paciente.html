<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembra+ | Meu perfil</title>
  <link rel="icon" href="./assets/img/favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/components.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="back-btn" onclick="goTo('inicio-paciente.html')" type="button">&lt;</button>
      <div class="topbar-title">Meu perfil</div>
      <span style="width:40px"></span>
    </header>

    <section class="content" style="padding-bottom:40px">
      <div class="profile-banner">
        <div class="profile-avatar-lg" data-patient-initials>ML</div>
        <h2 style="margin:0;font-family:var(--font-serif)" data-patient-name>Maria Luiza</h2>
        <p style="opacity:.8;margin:6px 0 0">Paciente · <span data-patient-condition>Alzheimer leve</span></p>
        <div style="display:flex;gap:10px;margin-top:12px">
          <span class="badge violet" data-patient-type>A+</span>
        </div>
      </div>

      <div class="info-card">
        <div class="section-title" style="padding:16px 16px 0">Informações básicas</div>
        <div class="info-row"><span class="muted">Nome completo</span><strong data-patient-fullname>Maria Luiza Ferreira</strong></div>
        <div class="info-row"><span class="muted">Telefone</span><strong data-patient-phone>—</strong></div>
        <div class="info-row"><span class="muted">Diagnóstico</span><strong data-patient-condition>Alzheimer leve</strong></div>
        <div class="section-title" style="padding:16px 16px 0">Observações</div>
        <div class="info-row"><span class="muted">Restrições</span><strong data-patient-notes style="text-align:right;max-width:58%">Sem restrições informadas</strong></div>
      </div>

      <div class="actions" style="padding:16px">
        <a class="btn secondary" href="./cadastro-paciente.html">Editar cadastro</a>
      </div>
    </section>
  </main>
  <script src="./assets/script/lembra-v2.js"></script>
</body>
</html>
