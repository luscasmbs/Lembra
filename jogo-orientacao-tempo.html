<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembra+ | Orientacao no tempo</title>
  <link rel="icon" href="./assets/img/favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/components.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="back-btn" onclick="goTo('jogos.html')" type="button">&lt;</button>
      <div>
        <div class="topbar-title">Orientacao no tempo</div>
        <div class="topbar-subtitle">Dia, mes e rotina</div>
      </div>
      <span class="brand-small">lembra+</span>
    </header>

    <section class="content-tight orientation-layout">
      <div class="card orientation-card">
        <span class="badge red">📅 exercicio diario</span>
        <h1 style="font-family:Georgia,serif;margin:14px 0 8px">Vamos lembrar o dia de hoje</h1>
        <p class="muted">Responda com calma. Se errar, o app mostra uma pista e voce pode tentar de novo.</p>
      </div>

      <div class="card orientation-card">
        <div class="row-title" data-orientation-question>Pergunta</div>
        <div class="orientation-options" data-orientation-options></div>
        <p class="muted" data-orientation-feedback style="min-height:24px;margin-bottom:0"></p>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:14px">
          <div>
            <div class="row-title">Progresso</div>
            <div class="row-subtitle"><span data-orientation-score>0</span> de 4 respostas</div>
          </div>
          <button class="btn secondary" data-orientation-reset type="button" style="width:auto">Reiniciar</button>
        </div>
        <div class="progress" style="margin-top:14px"><span data-orientation-progress style="width:0%"></span></div>
      </div>
    </section>

    <section class="finish-card" data-finish></section>
  </main>
  <script src="./assets/script/lembra-v2.js"></script>
</body>
</html>
