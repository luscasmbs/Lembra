<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembra+ | Entrar como cuidador</title>
  <link rel="icon" href="./assets/img/favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages/auth.css">
</head>
<body>
  <main class="auth-page">
    <button class="back-btn" onclick="goTo('boas-vindas.html')" type="button" style="align-self:flex-start;margin-bottom:24px">&lt; Voltar</button>
    <h1 style="font-family:var(--font-serif);font-size:26px;margin:0 0 8px">Entrar como cuidador</h1>
    <p class="muted" style="margin-bottom:32px">Gerencie e monitore o paciente</p>

    <form class="form-card" style="box-shadow:none;padding:0" data-login-cuidador>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="••••••••" required>
      </div>
      <div class="actions">
        <button class="btn btn-care" type="submit">Entrar</button>
        <a class="btn secondary" href="./cadastro-cuidador.html">Não tem conta? Cadastre-se</a>
      </div>
    </form>
  </main>
  <script src="./assets/script/lembra-v2.js"></script>
</body>
</html>
